<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Orders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="./orders.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <ul class="menu">
                <li title="Dashboard">
                    <a href="../dashboard/dashboard.html">
                        <i class="fa-solid fa-gauge"></i>
                    </a>
                </li>

                <li title="Products">
                    <a href="../products/products.html">
                        <i class="fa-solid fa-box"></i>
                    </a>
                </li>

                <li title="Orders">
                    <a href="../orders/orders.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </a>
                </li>

                <li title="Contacts">
                    <a href="../contacts/contacts.html">
                        <i class="fa-solid fa-users"></i>
                    </a>
                </li>

                <li title="Subscribers">
                    <a href="../subscribers/subscribers.html">
                        <i class="fa-solid fa-bell"></i>
                    </a>
                </li>
            </ul>
        </aside>

        
        <div class="main">

            
            <div class="header">
                <h1>Orders Management</h1>
            </div>
            
            <div class="middle-first">

                <div class="search-box">
                    <input type="text" placeholder="Search by Order Number" class="search-input-box" id="searchInput">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>


            </div>

            
            <div class="main-middle">
                <div class="orders-detail">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Order No</th>
                                <th>User id</th>
                                <th>Customer</th>
                                <th>Amount</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="orderTable"></tbody>
                    </table>

                </div>
            </div>

        </div>

        
    </div>

    <div class="pagination-wrapper">
            <div id="pagination"></div>
        </div>

    
    <script src="./orders.js"></script>

</body>

</html>
