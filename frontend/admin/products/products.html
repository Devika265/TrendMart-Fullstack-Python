<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./products.css">
</head>
<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <ul class="menu">
                <li title="Dashboard">
                    <a href="../dashboard/dashboard.html">
                        <i class="fa-solid fa-gauge"></i>
                    </a>
                </li>

                <li title="Products">
                    <a href="../products/products.html">
                        <i class="fa-solid fa-box"></i>
                    </a>
                </li>

                <li  title="Orders">
                    <a href="../orders/orders.html">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </a>
                </li>

                <li title="Contacts">
                    <a href="../contacts/contacts.html">
                        <i class="fa-solid fa-users"></i>
                    </a>
                </li>

                <li title="Subscribers">
                    <a href="../subscribers/subscribers.html">
                        <i class="fa-solid fa-bell"></i>
                    </a>
                </li>
            </ul>
        </aside>


        <div class="main">
            <header class="topbar">
                <h2>Products</h2>
                <div class="products-header">
                    <button id="addProductBtn" onclick="openModal()">+ Add Product</button>
                </div>
            </header>

            <section class="middle-section">
                <div class="filter">
                    <div class="filter-product"><input type="text" placeholder="Product Name" id="filterName"></div>
                    <div class="filter-product"><input type="text" placeholder="Category" id="filterCategory"></div>
                    <div class="filter-product"><input type="number" placeholder="Min Price" id="filterMinPrice"></div>
                    <div class="filter-product"><input type="number" placeholder="Max Price" id="filterMaxPrice"></div>
                </div>
            </section>

            <section class="productlist-section">
                <div class="product-container">
                    <table class="product-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Offer Price</th>
                                <th>Original Price</th>
                                <th>Rating</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            </tbody>
                    </table>
                </div>
                <div id="paginationControls" class="pagination-container"></div>
            </section>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Product</h3>
            <form id="productForm">
                <input type="hidden" id="productId">
                <input type="text" id="name" placeholder="Product Name" required>
                <textarea id="description" placeholder="Short Product Description..." rows="3" required></textarea>
                <div class="input-row">
                    <input type="number" id="original_price" placeholder="Original Price" required>
                    <input type="number" id="offer" placeholder="Offer %" required>
                </div>
                <input type="number" id="offer_price" placeholder="Offer Price (Auto)" readonly>
                <input type="number" id="rating" placeholder="Rating (1-5)" min="1" max="5">
                <input type="text" id="category" placeholder="Category" required>
                <input type="number" id="stock" placeholder="Stock" required>
                <input type="text" id="image_url" placeholder="Image URL" required>
                
                <div class="modal-buttons">
                    <button type="submit" class="save-btn">Save Product</button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" style="
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #4caf50;
    color: white;
    padding: 12px 20px;
    border-radius: 5px;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 1000;
">
    Notification
</div>



<div id="deleteModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Confirm Delete</h3>
    <p>Are you sure you want to delete this product?</p>
    <div class="modal-actions">
      <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
      <button id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
    </div>
  </div>
</div>

    <script src="./products.js"></script>
</body>
</html>
