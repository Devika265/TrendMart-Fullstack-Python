<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../css/forgot.css">
</head>

<body>

<div class="auth-container">
    <div class="auth-card">
        <h2>Recover Account</h2>

        <form id="forgotPasswordForm">
            <div class="input-group">
                <label for="resetEmail">Registered Email</label>
                <input type="email" id="resetEmail" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
                <label for="newPassword">New Secure Password</label>
                <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
                <i class="far fa-eye toggle-password" id="togglePasswordIcon"></i>
            </div>

            <button type="submit" class="btn-primary">Reset Password</button>
        </form>

        <div class="auth-footer">
            <a href="login.html">Back to Login</a>
        </div>
    </div>
</div>


    <script src="../js/forgot.js"></script>

</body>

</html>
